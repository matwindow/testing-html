<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>32x16 Effect Box Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(32, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 2px;
      width: 100vw;
      height: 100vh;
    }

    effect-box {
      display: block;
      width: 100%;
      height: 100%;
      background: #181818;
      transition: background 1.5s;
    }

    effect-box:hover {
      background: #0f0;
      transition: background 0s;
    }
  </style>
</head>
<body>
  <section id="grid"></section>

  <script>
    const grid = document.getElementById("grid");

    for (let i = 0; i < 32 * 16; i++) {
      grid.appendChild(document.createElement("effect-box"));
    }
  </script>
</body>
</html>

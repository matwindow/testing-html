<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Circular Flash & White Charge Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    #grid {
      --x: -500px;
      --y: -500px;
      position: relative;
      display: grid;
      grid-template-columns: repeat(32, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 2px;
      width: 100vw;
      height: 100vh;
      /* Pure CSS circular spotlight behind the grid gaps */
      background: radial-gradient(
        circle 220px at var(--x) var(--y),
        #0f0 0%,
        rgba(0, 255, 0, 0.25) 45%,
        #000 100%
      );
    }

    /* Semi-transparent circular glow overlay on top of the boxes */
    #grid::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 200px at var(--x) var(--y),
        rgba(0, 255, 0, 0.45) 0%,
        rgba(0, 255, 0, 0.12) 50%,
        transparent 100%
      );
    }

    effect-box {
      display: block;
      width: 100%;
      height: 100%;
      background: #181818;
      transition: background 1.2s ease-out;
    }

    /* Pure CSS hover trail + automatic white charge when staying on a box */
    effect-box:hover {
      background: #0f0;
      transition: background 0s;
      animation: chargeToWhite 0.7s forwards;
    }

    @keyframes chargeToWhite {
      0% {
        background: #0f0;
      }
      100% {
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <section id="grid"></section>

  <script>
    const grid = document.getElementById("grid");

    for (let i = 0; i < 32 * 16; i++) {
      grid.appendChild(document.createElement("effect-box"));
    }

    grid.addEventListener("mousemove", (e) => {
      grid.style.setProperty("--x", `${e.clientX}px`);
      grid.style.setProperty("--y", `${e.clientY}px`);
    });
  </script>
</body>
</html>
